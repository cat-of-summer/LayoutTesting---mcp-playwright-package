<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фикстура: элемент, скрытый скролл-контейнером</title>
<!--
  Ложное «текст под непрозрачным слоем».

  Рейл годов — собственный контейнер прокрутки: содержимое выше его высоты, лишнее он
  обрезает. У обрезанных кнопок getBoundingClientRect() по-прежнему внутри экрана, хотя
  на экране их нет — рисует там уже подвал. Проба точкой видит подвал и объявляет текст
  перекрытым, хотя перекрытия нет: элемент просто уехал за край своего контейнера.

  Отличать надо по пересечению с client-боксом клипающего предка, а не по видимости
  во вьюпорте. Внизу для контраста лежит настоящее перекрытие — его находить обязаны.
-->
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fff; }

  /* Рейл: восемь кнопок по 60px в контейнере высотой 200px — видно три с небольшим. */
  .rail { position: absolute; top: 0; left: 0; width: 160px; height: 200px; overflow-y: auto; }
  .rail__tab { display: block; width: 150px; height: 60px; background: #fff;
               border: 1px solid #ccd2dd; font: inherit; }

  /* Непрозрачный подвал ровно под рейлом — он и попадает в пробу. */
  .foot { position: absolute; top: 200px; left: 0; width: 100%; height: 300px;
          background: #14161a; color: #eef1f6; padding: 16px; }

  /* Настоящее перекрытие: плашка поверх текста, тут находка законна. */
  .real { position: relative; margin: 520px 0 0; padding: 16px; }
  .real__text { width: 300px; }
  .real__cover { position: absolute; inset: 0; background: #ffd7d5; }
</style>
</head>
<body>

<div class="rail">
  <button class="rail__tab">1924</button>
  <button class="rail__tab">1925</button>
  <button class="rail__tab">1926</button>
  <button class="rail__tab">1927</button>
  <button class="rail__tab">1928</button>
  <button class="rail__tab">1929</button>
  <button class="rail__tab">1930</button>
  <button class="rail__tab">1931</button>
</div>

<footer class="foot">Подвал под рейлом</footer>

<section class="real">
  <p class="real__text" id="really-covered">Этот абзац действительно закрыт плашкой целиком.</p>
  <div class="real__cover"></div>
</section>

</body>
</html>
