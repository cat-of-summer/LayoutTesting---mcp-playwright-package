<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ленивые картинки ниже сгиба</title>
<!--
  Проверка догрузки перед снимком.

  Картинки помечены loading="lazy" и отодвинуты вниз распорками: пока они не попали
  в область просмотра, браузер не начинает загрузку вовсе. Ожидание события load такую
  картинку не дожидается никогда — снимок выходит с пустыми рамками, и об этом ничто
  не сообщает. Отсюда требование: перед съёмкой снять ленивость и прокрутить документ.

  Файлы картинок отдаёт тестовый сервер, поэтому открывать этот файл нужно по http,
  а не через file://.
-->
<style>
  body { margin: 0; font: 16px/1.5 sans-serif; }
  .spacer { height: 1200px; background: linear-gradient(#fafafa, #eee); }
  figure { margin: 0; padding: 24px; }
  img { display: block; width: 300px; height: auto; }
</style>
</head>
<body>
  <h1>Верх страницы</h1>

  <figure>
    <img src="img/eager.png" alt="в первом экране">
    <figcaption>Обычная картинка, видна сразу</figcaption>
  </figure>

  <div class="spacer"></div>

  <figure>
    <img src="img/lazy-1.png" loading="lazy" alt="ниже сгиба, первая">
    <figcaption>Ленивая № 1</figcaption>
  </figure>

  <div class="spacer"></div>

  <figure>
    <img src="img/lazy-2.png" loading="lazy" alt="ниже сгиба, вторая">
    <figcaption>Ленивая № 2</figcaption>
  </figure>

  <div class="spacer"></div>

  <figure>
    <img src="img/lazy-3.png" loading="lazy" alt="в самом низу">
    <figcaption>Ленивая № 3</figcaption>
  </figure>
</body>
</html>
