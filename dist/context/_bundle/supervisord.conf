environment=CONNECT_TIMEOUT_SECONDS="5",SOCKET_TIMEOUT_SECONDS="5",TRAEFIK_DOMAIN="%(ENV_VNU_TRAEFIK_DOMAIN)s",EXTERNAL_ACCESS="%(ENV_VNU_EXTERNAL_ACCESS)s"
