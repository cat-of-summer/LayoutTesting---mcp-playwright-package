command=nginx -g "daemon off;"
priority=41
; Released by the entrypoint once every service's own init script has finished.
autostart=false
autorestart=true
startsecs=1
startretries=3
stopsignal=QUIT
stopwaitsecs=15
stopasgroup=true
killasgroup=true
; Output goes to the container's stdout unmodified. Piping it through a prefixing
; filter would make that filter the process supervisord tracks, corrupting exit codes
; and autorestart, so per-service views come from `dockerbundle logs nginx`
; against the copy in childlogdir instead.
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vnu]
command=/opt/vnu-runtime-image/bin/java -m vnu/nu.validator.servlet.Main 8888
priority=50
; Released by the entrypoint once every service's own init script has finished.
