map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/common.conf;

    root /var/www/html/${PHP_WORKDIR};

    location /static/ {
        include /etc/nginx/snippets/static-cache.conf;
        try_files $uri =404;
    }

    location /media/ {
        expires 30d;
        add_header Cache-Control          "public"  always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ @python;
    }

    location @python {
        proxy_pass http://python${INSTANCE}:${PYTHON_PORT};

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_hide_header X-Powered-By;

        proxy_buffer_size       32k;
        proxy_buffers           8 32k;
        proxy_busy_buffers_size 64k;
        proxy_connect_timeout   60s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;
    }

    location ~ \.py$ { return 404; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* { deny all; }
}
