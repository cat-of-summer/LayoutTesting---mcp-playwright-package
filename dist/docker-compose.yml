services:
  layout:
    image: ${BUNDLE_IMAGE:-ghcr.io/cat-of-summer/layouttesting---mcp-playwright-package:latest}
    container_name: layout${INSTANCE:-}
    restart: unless-stopped
    env_file: .env
    # Asked for by one of the baked services. Docker's 64 MB default is where Chromium
    # runs out of shared memory part-way through a page.
    shm_size: ${PLAYWRIGHT_SHM_SIZE:-2gb}
    ports:
      - "${NGINX_EXTERNAL_ACCESS:-127.0.0.1:8080:80}"
      - "${MCP_ACCESS:-127.0.0.1:8931:8931}"
      - "${VNU_EXTERNAL_ACCESS}"
    volumes:
      - artifacts:/var/www/html/artifacts
      - baselines:/var/www/html/baselines
    networks:
      - network
    healthcheck:
      test: ["CMD", "/usr/local/bin/bundle-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    # Carried over from the services that were baked in. A label describes the whole
    # container, so where two of them disagreed the first was kept and the clash was
    # reported at generation time.
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.http.routers.nginx${INSTANCE}.rule=Host(`${NGINX_TRAEFIK_DOMAIN:-localhost}`)"
      - "traefik.http.routers.nginx${INSTANCE}.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.nginx${INSTANCE}.priority=100"
      - "traefik.http.routers.nginx${INSTANCE}.service=nginx${INSTANCE}"
      - "traefik.http.services.nginx${INSTANCE}.loadbalancer.server.port=80"
      - "traefik.http.routers.nginx-redirect${INSTANCE}.rule=Host(`${NGINX_TRAEFIK_DOMAIN:-localhost}`)"
      - "traefik.http.routers.nginx-redirect${INSTANCE}.entrypoints=web"
      - "traefik.http.routers.nginx-redirect${INSTANCE}.priority=10"
      - "traefik.http.routers.nginx-redirect${INSTANCE}.middlewares=redir-nginx${INSTANCE}@docker"
      - "traefik.http.middlewares.redir-nginx${INSTANCE}.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redir-nginx${INSTANCE}.redirectscheme.permanent=true"
      - "traefik.http.routers.vnu${INSTANCE}.rule=Host(`${VNU_TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.vnu${INSTANCE}.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.vnu${INSTANCE}.priority=100"
      - "traefik.http.routers.vnu${INSTANCE}.service=vnu${INSTANCE}"
      - "traefik.http.services.vnu${INSTANCE}.loadbalancer.server.port=8888"
      - "traefik.http.routers.vnu-redirect${INSTANCE}.rule=Host(`${VNU_TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.vnu-redirect${INSTANCE}.entrypoints=web"
      - "traefik.http.routers.vnu-redirect${INSTANCE}.priority=10"
      - "traefik.http.routers.vnu-redirect${INSTANCE}.middlewares=redir-vnu${INSTANCE}@docker"
      - "traefik.http.middlewares.redir-vnu${INSTANCE}.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redir-vnu${INSTANCE}.redirectscheme.permanent=true"

volumes:
  artifacts:
  baselines:

networks:
  network:
    external: true
    name: ${NETWORK:-network}
