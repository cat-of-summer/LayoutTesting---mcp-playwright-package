version: 1
name: layout
output: dist

# Публикуемый образ. Держим здесь, а не только во флаге `generate --image`: иначе
# очередная перегенерация тихо вернёт в compose layout:latest, и инструкция из README
# перестанет работать.
image: ghcr.io/cat-of-summer/layouttesting---mcp-playwright-package:latest

variants: [cpu]

# Браузеры, их системные зависимости и Node уже внутри образа Playwright, и версия
# закреплена вместе с пакетом playwright в mcp/data/package.json. Собирать это на
# debian-базе значило бы повторять чужую работу и разъезжаться с ней при обновлении.
base:
  cpu: mcr.microsoft.com/playwright:v1.62.1-noble

network:
  name: network
  external: true

port_range: [20000, 20999]

# TRAEFIK_DOMAIN намеренно убран из globals: домены у стенда и у валидатора разные,
# а глобальный ключ конфликт не разрешает, а замалчивает.
globals: [NETWORK, INSTANCE, TZ, TRAEFIK_ENTRYPOINT, ACME_EMAIL]

sources:
  - {type: catalog, path: .}

env_conflicts:
  # Два роутера traefik на один контейнер: стенд и валидатор отвечают на разных доменах.
  TRAEFIK_DOMAIN: prefix
  # Метка traefik.enable описывает контейнер целиком, поэлементно её не разложить.
  TRAEFIK_ENABLE: value:true
  EXTERNAL_ACCESS: prefix
  # В бандле валидатор — соседний процесс, а не контейнер vnu_layout: сервисы делят
  # network namespace. Без этой строки MCP молча свалился бы на встроенный html-validate,
  # и проверка разметки стала бы беднее, ничего об этом не сказав.
  VNU_URL: value:http://127.0.0.1:8888

# Отчёты и эталоны сравнения лежат внутри запечённого /var/www/html, своего маунта в
# исходном compose у них нет — и без этих строк первый же docker pull их потеряет.
volumes:
  artifacts: /var/www/html/artifacts
  baselines: /var/www/html/baselines

services:
  # traefik и сеть подняты отдельно и переживают пересборку стенда.
  traefik: {enabled: false}
  network: {enabled: false}

  # Рецепты названы явно, чтобы результат не зависел от очков подбора: все три лежат
  # в recipes/ рядом с этим файлом.
  mcp_nginx: {recipe: nginx}
  mcp_playwright: {recipe: playwright}
  vnu: {recipe: vnu}
