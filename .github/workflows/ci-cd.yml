name: ci/cd

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
      - '**/v*'
  pull_request: {}
  workflow_dispatch:
    inputs:
      commits:
        description: 'Comma-separated commits to deploy. Empty = deploy the whole tree.'
        required: false
        type: string
        default: ''
      deploy_mirror:
        description: 'Deletions on the server: false = keep all, true = delete files removed in the commits, full = exact mirror. default = DEPLOY_MIRROR variable.'
        required: false
        type: choice
        options: ['default', 'false', 'true', 'full']
        default: 'default'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  ci-cd:
    uses: cat-of-summer/git_toolkit/.github/workflows/ci-cd.yml@main
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
      SECRETS_JSON: ${{ secrets.SECRETS_JSON }}
    with:
      commits: ${{ inputs.commits || '' }}
      deploy_mirror: ${{ inputs.deploy_mirror || '' }}
