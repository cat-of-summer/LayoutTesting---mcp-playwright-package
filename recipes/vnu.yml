# Nu Html Checker.
#
# Без рецепта сервис уходил в rootfs-fallback: файловая система образа валидатора
# вливалась в бандл целиком ради одного каталога. Здесь берётся только он — это
# самодостаточный jlink-рантайм, свой JRE ставить не надо.
name: vnu
priority: 60

match:
  image:
    - "ghcr.io/validator/validator"
    - "ghcr.io/validator/validator:*"
    - "validator/validator:*"
  service: [vnu]

families: [debian, alpine]

copy:
  # {image} — тот же образ, что назван в vnu/.env: версия остаётся закреплённой в одном
  # месте и не разъезжается с рецептом.
  - src: /vnu-runtime-image
    dest: /opt/vnu-runtime-image
    from_image: "{image}"
    kind: config
    optional: false

port:
  default: 8888
  # Порт задаётся аргументом команды ниже, отдельного конфига у валидатора нет.
  configure: {type: none}

supervisor:
  - name: vnu
    command: /opt/vnu-runtime-image/bin/java -m vnu/nu.validator.servlet.Main {port}
    priority: 50
    stopsignal: TERM
    stopwaitsecs: 30
    scalable: false
    critical: true
    environment:
      # Те же значения, что задавал vnu/docker-compose.yml: без них валидатор ждёт
      # медленный внешний ресурс дольше, чем стенд готов ждать ответа.
      CONNECT_TIMEOUT_SECONDS: "5"
      SOCKET_TIMEOUT_SECONDS: "5"

readiness:
  - type: tcp
    target: "{port}"
    timeout: 60
