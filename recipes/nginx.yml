# Заменяет встроенный рецепт nginx целиком.
#
# Встроенный ждёт один nginx.conf в каталоге сервиса и подсовывает его в
# /tmp/nginx.conf.template. Здесь раскладка другая: набор шаблонов в
# services/nginx/configs/, а нужный выбирает сам entrypoint.nginx.sh по NGINX_CONF,
# прогоняет через envsubst и кладёт в conf.d/default.conf. Мешать ему не надо — надо
# положить шаблоны туда, где он их ищет.
name: nginx
priority: 60

match:
  image: ["nginx", "nginx:*", "*/nginx", "*/nginx:*"]
  service: [nginx]

families: [debian]

# iproute2 сверх набора встроенного рецепта: entrypoint.nginx.sh считает
# set_real_ip_from через `ip route`, и при `set -e` его отсутствие валит старт. В
# исходном образе nginx:alpine `ip` давал busybox, на debian-базе его нет.
install:
  debian: [nginx-light, gettext-base, openssl, iproute2]

run:
  # Дефолтный сайт debian-сборки слушает :80 и перехватывал бы запросы стенда.
  debian: ["rm -f /etc/nginx/sites-enabled/default"]

shared: nginx

copy:
  - src: services/nginx/configs
    dest: /etc/nginx/configs
    kind: config
    optional: false

post_copy:
  # Внутри бандла все сервисы делят network namespace, и хоста playwright${INSTANCE}
  # просто нет. ${MCP_PORT} остаётся переменной: его подставит envsubst при старте.
  - "sed -i 's|proxy_pass http://playwright[^:]*:|proxy_pass http://127.0.0.1:|g' /etc/nginx/configs/nginx.playwright.conf"

port:
  default: 80
  configure:
    type: nginx_conf
    # Именно этот шаблон, а не nginx.{name}.conf: какой из набора пойдёт в дело, решает
    # NGINX_CONF, и у этого проекта он равен playwright.
    file: /etc/nginx/configs/nginx.playwright.conf

supervisor:
  - name: nginx
    command: nginx -g "daemon off;"
    priority: 40
    stopsignal: QUIT
    stopwaitsecs: 15
    scalable: false
    critical: true

readiness:
  - type: tcp
    target: "{port}"
    timeout: 30

mount_kinds:
  # Отчёты и фикстуры запекает рецепт playwright; второй COPY того же дерева только
  # раздул бы образ.
  "/var/www/html": skip
