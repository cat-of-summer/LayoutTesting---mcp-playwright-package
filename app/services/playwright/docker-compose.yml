services:
  playwright:
    build:
      context: .
      dockerfile: services/playwright/Dockerfile.playwright
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-v1.62.1-noble}
        PLAYWRIGHT_APT_PACKAGES: ${PLAYWRIGHT_APT_PACKAGES:-fonts-noto-core fonts-noto-color-emoji fonts-noto-cjk fonts-liberation fonts-dejavu-core}
        PLAYWRIGHT_ENTRYPOINT: ${PLAYWRIGHT_ENTRYPOINT:-services/playwright/entrypoint.playwright.sh}
    hostname: playwright${INSTANCE}
    container_name: playwright${INSTANCE}
    restart: unless-stopped
    init: true
    shm_size: ${PLAYWRIGHT_SHM_SIZE:-2gb}
    working_dir: /var/www/html
    volumes:
      - ./data:/var/www/html
    ports:
      - "${MCP_ACCESS:-127.0.0.1:8931:8931}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      - MCP_PORT=${MCP_PORT:-8931}
      - PLAYWRIGHT_MODE=${PLAYWRIGHT_MODE:-mcp}
    networks:
      - network

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.MCP_PORT||8931)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

networks:
  network:
    external: true
    name: ${NETWORK:-network}
