upstream apache_backend {
    server apache${INSTANCE}:${APACHE_PORT};
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/common.conf;

    root /var/www/html/${PHP_WORKDIR};

    open_file_cache          max=10000 inactive=30s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   off;

    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|svg|bmp|css|js|woff|woff2|ttf|otf|eot|pdf|zip|gz|mp4|mp3|ogg|webm)$ {
        include /etc/nginx/snippets/static-cache.conf;
        try_files $uri @apache;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* { deny all; }

    location ~* \.php$ {
        try_files /nonexistent @apache;
    }

    location / {
        try_files $uri @apache;
    }

    location @apache {
        proxy_pass         http://apache_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_hide_header  X-Powered-By;
        proxy_hide_header  Server;
        proxy_request_buffering off;
        proxy_connect_timeout   60s;
        proxy_send_timeout      120s;
        proxy_read_timeout      120s;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
    }
}
