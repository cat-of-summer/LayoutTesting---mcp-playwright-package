server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/common.conf;

    root  /var/www/html/${DIST_PATH};
    index index.html;

    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime  on;

    # Артефакты перезаписываются под теми же именами: кэш показывал бы прошлый прогон.
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Тестовые страницы и зеркала лежат рядом с артефактами, а не под их корнем.
    #
    # Префикс помечен ^~ намеренно: без него nginx после выбора префикса всё равно проверяет
    # регулярные локации, и любое будущее правило вида location ~ \.html$ молча перехватит
    # и фикстуры, и зеркала.
    location ^~ /fixtures/ {
        alias /var/www/html/fixtures/;
        add_header Cache-Control "no-store, must-revalidate" always;
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Зеркала сохранённых страниц. Каталог не чистится автоматически, в отличие от артефактов:
    # обход на сотни страниц стоит дорого и переживать автоочистку по счётчику прогонов не должен.
    location ^~ /sites/ {
        alias /var/www/html/sites/;
        add_header Cache-Control "no-store, must-revalidate" always;
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Streamable HTTP держит долгий SSE-поток: с буферизацией ответы застревают.
    location /mcp {
        proxy_pass http://playwright${INSTANCE}:${MCP_PORT};

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    location /health {
        access_log off;
        proxy_pass http://playwright${INSTANCE}:${MCP_PORT}/health;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* { deny all; }
}
